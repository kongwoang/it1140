<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tin học đại cương – IT1140</title>
    <meta
      name="description"
      content="Trang ôn tập Tin học đại cương IT1140 với các chế độ luyện tập, thi thử và xem đáp án."
    />
    <meta name="theme-color" content="#0f766e" />
    <style>
:root {
  color-scheme: light;
  --paper: #f4f3ec;
  --surface: #fffefa;
  --surface-strong: #edf5ee;
  --surface-inset: #f7f6ef;
  --ink: #20242d;
  --muted: #656f70;
  --muted-soft: #8a928f;
  --line: rgba(42, 55, 49, 0.16);
  --line-soft: rgba(42, 55, 49, 0.09);
  --teal: #0f766e;
  --teal-dark: #0b5d58;
  --coral: #d9483b;
  --gold: #b77900;
  --blue: #2f63d8;
  --green-soft: #dff4ec;
  --red-soft: #fde7e3;
  --yellow-soft: #fff1c7;
  --shadow: 0 14px 34px rgba(32, 36, 45, 0.075);
  --shadow-tight: 0 8px 22px rgba(32, 36, 45, 0.055);
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(rgba(15, 118, 110, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15, 118, 110, 0.035) 1px, transparent 1px),
    linear-gradient(180deg, #fbfaf4, var(--paper));
  background-size: 32px 32px, 32px 32px, auto;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.4;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.choice-control {
  width: 16px;
  height: 16px;
  margin: 3px 0 0;
  accent-color: var(--teal);
}

.choice.is-disabled {
  cursor: not-allowed;
}


.app-shell {
  min-height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 56px;
  padding: 8px clamp(14px, 2vw, 24px);
  border-bottom: 1px solid var(--line-soft);
  background: rgba(255, 254, 250, 0.92);
  backdrop-filter: blur(12px);
  box-shadow: 0 1px 0 rgba(42, 55, 49, 0.04);
  position: sticky;
  top: 0;
  z-index: 5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 190px;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--teal);
  color: white;
  font-size: 21px;
  font-weight: 800;
}

.brand h1 {
  margin: 1px 0 0;
  font-size: clamp(18px, 1.55vw, 23px);
  line-height: 1.05;
  letter-spacing: 0;
}

.eyebrow {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.top-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
}

.layout {
  display: grid;
  grid-template-columns: minmax(190px, 240px) minmax(0, 1fr) minmax(190px, 236px);
  align-items: start;
  gap: 12px;
  padding: 10px clamp(14px, 2vw, 24px) 18px;
}

.left-rail,
.right-rail {
  display: grid;
  align-content: start;
  gap: 10px;
  position: sticky;
  top: 66px;
  max-height: calc(100vh - 78px);
  overflow: auto;
}

.panel,
.question-panel {
  background: rgba(255, 254, 250, 0.96);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow-tight);
}

.panel {
  padding: 12px;
}

.filters {
  display: grid;
  gap: 9px;
}

.field {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.field.compact {
  grid-template-columns: auto minmax(150px, 1fr);
  align-items: center;
  min-width: 214px;
}

.field input,
.field select {
  width: 100%;
  min-height: 36px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0 10px;
  background: var(--surface-inset);
  color: var(--ink);
  outline: none;
}

.field input:focus,
.field select:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
}

.segmented {
  display: inline-grid;
  grid-template-columns: repeat(3, minmax(56px, 1fr));
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface-inset);
  min-height: 36px;
}

.mode-btn {
  border: 0;
  padding: 0 11px;
  color: var(--muted);
  background: transparent;
  font-weight: 800;
}

.mode-btn + .mode-btn {
  border-left: 1px solid var(--line);
}

.mode-btn.is-active {
  color: #fff;
  background: var(--teal);
}

.ghost-btn,
.secondary-btn,
.primary-btn,
.pin-btn {
  min-height: 36px;
  border-radius: 8px;
  border: 1px solid var(--line);
  padding: 0 12px;
  background: var(--surface);
  color: var(--ink);
  font-weight: 800;
}

.ghost-btn:hover,
.secondary-btn:hover,
.pin-btn:hover {
  border-color: var(--teal);
  color: var(--teal-dark);
}

.ghost-btn.danger:hover {
  border-color: var(--coral);
  color: var(--coral);
}

.primary-btn {
  border-color: var(--teal);
  background: var(--teal);
  color: #fff;
  min-width: 118px;
}

.primary-btn:hover {
  background: var(--teal-dark);
}

.primary-btn:disabled,
.secondary-btn:disabled {
  cursor: not-allowed;
  opacity: 0.48;
}

.checkline {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--ink);
  font-size: 14px;
  font-weight: 750;
}

.checkline input {
  width: 18px;
  height: 18px;
  accent-color: var(--teal);
}

.stats {
  display: grid;
  gap: 10px;
}

.stat-row,
.rail-heading,
.source-note {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.stat-row span,
.rail-heading span,
.source-note span {
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}

.meter {
  height: 8px;
  background: var(--surface-inset);
  border-radius: 999px;
  overflow: hidden;
}

.meter span {
  display: block;
  width: 0%;
  height: 100%;
  background: var(--teal);
  transition: width 180ms ease;
}

.score-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.score-grid div {
  display: grid;
  gap: 3px;
  padding: 8px 6px;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: var(--surface-inset);
  min-width: 0;
}

.score-grid span {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.score-grid strong {
  font-size: 18px;
}

.quiz-stage {
  min-width: 0;
  display: grid;
  grid-template-rows: auto auto auto;
  gap: 8px;
}

.question-toolbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  min-height: 32px;
  padding: 0 2px;
}

.question-toolbar > div {
  min-width: 0;
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 5px;
}

.tag {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  border-radius: 999px;
  padding: 0 8px;
  background: var(--surface-strong);
  color: var(--teal-dark);
  font-size: 11px;
  font-weight: 800;
}

.tag.source {
  background: var(--yellow-soft);
  color: #765200;
}

.tag.generated {
  background: #e8edff;
  color: var(--blue);
}

.pin-btn {
  width: 36px;
  padding: 0;
  font-size: 19px;
  line-height: 1;
  flex: 0 0 auto;
}

.pin-btn.is-active {
  border-color: var(--gold);
  background: var(--yellow-soft);
  color: var(--gold);
}

.question-panel {
  position: relative;
  display: grid;
  align-content: start;
  gap: 10px;
  overflow: hidden;
  padding: clamp(12px, 1.5vw, 16px);
  min-height: 0;
  box-shadow: var(--shadow);
}

.question-panel::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 4px;
  background: var(--teal);
}

.question-panel > * {
  position: relative;
}

.question-panel h2 {
  margin: 0;
  max-height: min(26vh, 188px);
  overflow: auto;
  padding: 0 4px 10px 8px;
  border-bottom: 1px solid var(--line-soft);
  font-size: clamp(15px, 1.16vw, 18px);
  line-height: 1.34;
  letter-spacing: 0;
  white-space: pre-line;
  scrollbar-width: thin;
}

.choice-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 7px;
}

.choice {
  display: grid;
  grid-template-columns: 20px 28px minmax(0, 1fr);
  align-items: start;
  gap: 9px;
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  padding: 9px 12px;
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  text-align: left;
  transition:
    border-color 140ms ease,
    background-color 140ms ease,
    box-shadow 140ms ease;
  cursor: pointer;
}

.choice:hover {
  border-color: var(--teal);
  background: #fbfffb;
}

.choice.is-selected {
  border-color: var(--blue);
  background: #f4f7ff;
  box-shadow: 0 0 0 2px rgba(47, 99, 216, 0.1);
}

.choice.is-correct {
  border-color: #249766;
  background: var(--green-soft);
}

.choice.is-wrong {
  border-color: var(--coral);
  background: var(--red-soft);
}

.choice-letter {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 8px;
  background: var(--surface-inset);
  color: var(--muted);
  font-weight: 900;
  font-size: 12px;
}

.choice.is-selected .choice-letter {
  background: #e8edff;
  color: var(--blue);
}

.choice.is-correct .choice-letter {
  background: #249766;
  color: #fff;
}

.choice.is-wrong .choice-letter {
  background: var(--coral);
  color: #fff;
}

.choice-text {
  min-width: 0;
  line-height: 1.32;
  white-space: pre-line;
}

.feedback {
  border: 1px solid var(--line);
  border-radius: 8px;
  max-height: min(24vh, 180px);
  overflow: auto;
  padding: 11px 12px;
  background: var(--surface-inset);
  line-height: 1.45;
}

.feedback strong {
  display: block;
  margin-bottom: 4px;
}

.feedback.good {
  border-color: #249766;
  background: var(--green-soft);
}

.feedback.bad {
  border-color: var(--coral);
  background: var(--red-soft);
}

.nav-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(108px, 148px));
  justify-content: center;
  gap: 10px;
}

.nav-row .secondary-btn:last-child {
  justify-self: stretch;
}

.nav-row > button {
  width: 100%;
}

.question-map {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(31px, 1fr));
  gap: 6px;
  max-height: min(42vh, 304px);
  overflow: auto;
  margin-top: 10px;
  padding-right: 2px;
  scrollbar-width: thin;
}

.map-btn {
  aspect-ratio: 1;
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
  font-weight: 850;
}

.map-btn.is-current {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
}

.map-btn.is-answered {
  background: #e8edff;
  color: var(--blue);
  border-color: rgba(47, 99, 216, 0.35);
}

.map-btn.is-correct {
  background: var(--green-soft);
  color: #116a47;
  border-color: #79c9a6;
}

.map-btn.is-wrong {
  background: var(--red-soft);
  color: #b83226;
  border-color: #efaca3;
}

.source-note {
  align-items: flex-start;
  flex-direction: column;
  gap: 4px;
}

.source-note strong {
  max-height: 72px;
  overflow: auto;
  line-height: 1.4;
  font-size: 12.5px;
  word-break: break-word;
  scrollbar-width: thin;
}

.slogan-footer {
  display: flex;
  justify-content: center;
  padding: 0 clamp(14px, 2vw, 24px) 22px;
}

.slogan-footer p {
  margin: 0;
  width: min(100%, 820px);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 16px;
  background: rgba(255, 254, 250, 0.94);
  box-shadow: var(--shadow-tight);
  color: var(--teal-dark);
  font-size: clamp(16px, 1.3vw, 20px);
  font-weight: 900;
  text-align: center;
}

@media (max-width: 1120px) {
  .layout {
    grid-template-columns: minmax(184px, 230px) minmax(0, 1fr);
  }

  .right-rail {
    grid-column: 1 / -1;
    position: static;
    max-height: none;
    overflow: visible;
  }

  .right-rail .question-map {
    max-height: 178px;
  }
}

@media (min-width: 980px) {
  .choice {
    min-height: 42px;
  }
}

@media (max-width: 760px) {
  .topbar {
    position: static;
    align-items: stretch;
    flex-direction: column;
    gap: 8px;
    padding-inline: 12px;
  }

  .brand {
    min-width: 0;
  }

  .top-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    justify-content: stretch;
    align-items: stretch;
  }

  .field.compact,
  .segmented {
    grid-column: 1 / -1;
  }

  .field.compact {
    grid-template-columns: auto minmax(0, 1fr);
    min-width: 0;
  }

  .ghost-btn {
    width: 100%;
  }

  .layout {
    grid-template-columns: 1fr;
    gap: 10px;
    padding-top: 8px;
    padding-inline: 12px;
  }

  .left-rail,
  .right-rail {
    position: static;
    max-height: none;
    overflow: visible;
  }

  .quiz-stage {
    order: 1;
  }

  .left-rail {
    order: 2;
  }

  .right-rail {
    order: 3;
  }

  .quiz-stage {
    grid-template-rows: auto auto auto;
  }

  .choice-list {
    grid-template-columns: 1fr;
  }

  .question-map {
    max-height: 170px;
  }

  .question-toolbar,
  .nav-row {
    align-items: stretch;
  }

  .nav-row {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .nav-row .secondary-btn:last-child {
    justify-self: stretch;
  }

  .primary-btn {
    min-width: 0;
  }
}

    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">IT</span>
          <div>
            <p class="eyebrow" id="subjectCode">IT1140</p>
            <h1 id="subjectTitle">Tin học đại cương</h1>
          </div>
        </div>

        <div class="top-actions">
          <label class="field compact">
            <span data-i18n="subjectLabel">Nội dung</span>
            <select id="subjectSelect"></select>
          </label>

          <div class="segmented" role="tablist" aria-label="Chế độ quiz" id="modeSwitch">
            <button type="button" class="mode-btn is-active" data-mode="practice">Luyện</button>
            <button type="button" class="mode-btn" data-mode="exam">Thi</button>
            <button type="button" class="mode-btn" data-mode="review">Ôn</button>
          </div>

          <button type="button" class="ghost-btn" id="shuffleBtn" title="Trộn câu">Trộn</button>
          <button type="button" class="ghost-btn danger" id="resetBtn" title="Xóa tiến độ hiện tại">Đặt lại</button>
        </div>
      </header>

      <main class="layout">
        <aside class="left-rail">
          <section class="panel filters">
            <label class="field">
              <span data-i18n="searchLabel">Tìm</span>
              <input id="searchInput" type="search" autocomplete="off" placeholder="Nhập từ khóa câu hỏi..." />
            </label>

            <label class="field">
              <span data-i18n="topicLabel">Chủ đề</span>
              <select id="topicFilter"></select>
            </label>

            <label class="field">
              <span data-i18n="sourceLabel">Nguồn</span>
              <select id="sourceFilter"></select>
            </label>

            <label class="checkline">
              <input id="bookmarkOnly" type="checkbox" />
              <span data-i18n="pinnedOnly">Đã ghim</span>
            </label>
          </section>

          <section class="panel stats">
            <div class="stat-row">
              <span data-i18n="progressLabel">Tiến độ</span>
              <strong id="progressText">0/0</strong>
            </div>
            <div class="meter" aria-hidden="true"><span id="progressBar"></span></div>
            <div class="score-grid">
              <div>
                <span data-i18n="correctLabel">Đúng</span>
                <strong id="correctText">0</strong>
              </div>
              <div>
                <span data-i18n="wrongLabel">Sai</span>
                <strong id="wrongText">0</strong>
              </div>
              <div>
                <span data-i18n="accuracyLabel">Tỉ lệ</span>
                <strong id="accuracyText">0%</strong>
              </div>
            </div>
          </section>
        </aside>

        <section class="quiz-stage" aria-live="polite">
          <div class="question-toolbar">
            <div>
              <p class="eyebrow" id="questionCount">Câu 0/0</p>
              <div class="tag-row" id="tagRow"></div>
            </div>
            <button type="button" class="pin-btn" id="bookmarkBtn" title="Ghim câu hỏi" aria-label="Ghim câu hỏi">☆</button>
          </div>

          <article class="question-panel">
            <h2 id="questionText">Không có câu hỏi phù hợp.</h2>
            <div class="choice-list" id="choiceList"></div>
            <div class="feedback" id="feedbackBox" hidden></div>
          </article>

          <div class="nav-row">
            <button type="button" class="secondary-btn" id="prevBtn">Trước</button>
            <button type="button" class="primary-btn" id="submitBtn">Kiểm tra</button>
            <button type="button" class="secondary-btn" id="nextBtn">Tiếp</button>
          </div>
        </section>

        <aside class="right-rail">
          <section class="panel">
            <div class="rail-heading">
              <span data-i18n="questionsLabel">Câu hỏi</span>
              <strong id="filteredCount">0</strong>
            </div>
            <div class="question-map" id="questionMap"></div>
          </section>

          <section class="panel source-note">
            <span data-i18n="currentSourceLabel">Nguồn hiện tại</span>
            <strong id="sourceText">-</strong>
          </section>
        </aside>
      </main>

      <footer class="slogan-footer" aria-label="Thông tin lưu trữ">
        <p>Tiến độ được lưu riêng trên thiết bị này · Không sử dụng cơ sở dữ liệu</p>
      </footer>
    </div>

  const els = {
    subjectCode: document.getElementById("subjectCode"),
    subjectTitle: document.getElementById("subjectTitle"),
    subjectSelect: document.getElementById("subjectSelect"),
    searchInput: document.getElementById("searchInput"),
    topicFilter: document.getElementById("topicFilter"),
    sourceFilter: document.getElementById("sourceFilter"),
    bookmarkOnly: document.getElementById("bookmarkOnly"),
    modeSwitch: document.getElementById("modeSwitch"),
    modeButtons: Array.from(document.querySelectorAll(".mode-btn")),
    staticLabels: Array.from(document.querySelectorAll("[data-i18n]")),
    shuffleBtn: document.getElementById("shuffleBtn"),
    resetBtn: document.getElementById("resetBtn"),
    progressText: document.getElementById("progressText"),
    progressBar: document.getElementById("progressBar"),
    correctText: document.getElementById("correctText"),
    wrongText: document.getElementById("wrongText"),
    accuracyText: document.getElementById("accuracyText"),
    questionCount: document.getElementById("questionCount"),
    tagRow: document.getElementById("tagRow"),
    bookmarkBtn: document.getElementById("bookmarkBtn"),
    questionText: document.getElementById("questionText"),
    choiceList: document.getElementById("choiceList"),
    feedbackBox: document.getElementById("feedbackBox"),
    prevBtn: document.getElementById("prevBtn"),
    submitBtn: document.getElementById("submitBtn"),
    nextBtn: document.getElementById("nextBtn"),
    filteredCount: document.getElementById("filteredCount"),
    questionMap: document.getElementById("questionMap"),
    sourceText: document.getElementById("sourceText"),
  };

  const initialSubjectId = data.subjects[0] ? data.subjects[0].id : "";
  let state = loadState();
  state.language = normalizeLanguage(state.language);

  function defaultState() {
    return {
      subjectId: initialSubjectId,
      language: "vi",
      mode: "practice",
      topic: "all",
      source: "all",
      query: "",
      bookmarkOnly: false,
      currentIndex: 0,
      answers: {},
      submitted: {},
      examRevealed: {},
      bookmarks: {},
      orders: {},
    };
  }

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      return { ...defaultState(), ...(saved || {}) };
    } catch (_error) {
      return defaultState();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
    } catch (_error) {
      // Một số chế độ riêng tư có thể chặn localStorage; quiz vẫn tiếp tục hoạt động trong phiên hiện tại.
    }
  }

  function currentSubject() {
    return data.subjects.find((item) => item.id === state.subjectId) || data.subjects[0];
  }

  function normalizeLanguage(language) {
    return supportedLanguages.includes(language) ? language : "vi";
  }

  function dictionary(language = state.language) {
    return i18n[normalizeLanguage(language)] || i18n.vi;
  }

  function t(key, ...args) {
    const value = dictionary()[key] ?? i18n.vi[key] ?? key;
    return typeof value === "function" ? value(...args) : value;
  }

  function mapText(group, id, fallback) {
    const value = dictionary()[group] && dictionary()[group][id];
    const fallbackValue = i18n.vi[group] && i18n.vi[group][id];
    return value || fallbackValue || fallback || id;
  }

  function subjectTitle(subject) {
    return mapText("subjects", subject.id, subject.title);
  }

  function topicLabel(subject, topic) {
    return mapText("topics", `${subject.id}:${topic.id}`, topic.label);
  }

  function sourceLabel(subject, source) {
    return mapText("sources", `${subject.id}:${source.id}`, source.label);
  }

  function difficultyLabel(level) {
    return mapText("difficulty", level, i18n.vi.difficulty[2]);
  }

  function localizedQuestion(question) {
    return {
      prompt: question.prompt,
      choices: question.choices,
      explanation: question.explanation,
    };
  }

  function sourceById(subject, id) {
    return subject.sources.find((item) => item.id === id);
  }

  function topicById(subject, id) {
    return subject.topics.find((item) => item.id === id);
  }

  function fold(text) {
    return String(text || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/đ/g, "d");
  }

  function questionHaystack(question) {
    const variants = [question.prompt, question.choices.join(" "), question.explanation];
    return fold(
      [
        ...variants,
        question.tags ? question.tags.join(" ") : "",
      ].join(" "),
    );
  }

  function filteredQuestions() {
    const subject = currentSubject();
    if (!subject) return [];

    const query = fold(state.query.trim());
    const base = subject.questions.filter((question) => {
      const matchesTopic = state.topic === "all" || question.topic === state.topic;
      const matchesSource = state.source === "all" || question.source === state.source;
      const matchesBookmark = !state.bookmarkOnly || Boolean(state.bookmarks[question.id]);
      const matchesQuery = !query || questionHaystack(question).includes(query);
      return matchesTopic && matchesSource && matchesBookmark && matchesQuery;
    });

    const order = state.orders[subject.id] || [];
    if (!order.length) return base;

    const rank = new Map(order.map((id, index) => [id, index]));
    return base.slice().sort((a, b) => {
      const aRank = rank.has(a.id) ? rank.get(a.id) : Number.MAX_SAFE_INTEGER;
      const bRank = rank.has(b.id) ? rank.get(b.id) : Number.MAX_SAFE_INTEGER;
      return aRank - bRank;
    });
  }

  function activeQuestion() {
    const questions = filteredQuestions();
    if (state.currentIndex >= questions.length) state.currentIndex = Math.max(0, questions.length - 1);
    return questions[state.currentIndex];
  }

  function isExamRevealed() {
    return Boolean(state.examRevealed[state.subjectId]);
  }

  function isRevealed(question) {
    if (!question) return false;
    return state.mode === "review" || Boolean(state.submitted[question.id]) || (state.mode === "exam" && isExamRevealed());
  }

  function isLocked(question) {
    if (!question) return true;
    return state.mode === "review" || Boolean(state.submitted[question.id]) || (state.mode === "exam" && isExamRevealed());
  }

  function setCurrentById(questionId) {
    const questions = filteredQuestions();
    const index = questions.findIndex((question) => question.id === questionId);
    if (index >= 0) {
      state.currentIndex = index;
      render();
    }
  }

  function optionLabel(index) {
    return letters[index] || String(index + 1);
  }

  function shuffle(items) {
    const copy = items.slice();
    for (let index = copy.length - 1; index > 0; index -= 1) {
      const target = Math.floor(Math.random() * (index + 1));
      [copy[index], copy[target]] = [copy[target], copy[index]];
    }
    return copy;
  }

  function applyStaticLanguage() {
    document.documentElement.lang = state.language;
    document.title = t("documentTitle");
    els.staticLabels.forEach((element) => {
      const key = element.dataset.i18n;
      element.textContent = t(key);
    });

    els.searchInput.placeholder = t("searchPlaceholder");
    els.modeSwitch.setAttribute("aria-label", t("modeAria"));
    els.bookmarkBtn.title = t("bookmarkTitle");
    els.bookmarkBtn.setAttribute("aria-label", t("bookmarkTitle"));
    els.shuffleBtn.textContent = t("shuffle");
    els.shuffleBtn.title = t("shuffleTitle");
    els.resetBtn.textContent = t("reset");
    els.resetBtn.title = t("resetTitle");
    els.prevBtn.textContent = t("prev");
    els.nextBtn.textContent = t("next");

    els.modeButtons.forEach((button) => {
      const isActive = button.dataset.mode === state.mode;
      button.textContent = dictionary().modes[button.dataset.mode] || button.dataset.mode;
      button.classList.toggle("is-active", isActive);
      button.setAttribute("aria-selected", String(isActive));
    });

  }

  function populateSubjectSelect() {
    els.subjectSelect.innerHTML = "";
    data.subjects.forEach((subject) => {
      const option = document.createElement("option");
      option.value = subject.id;
      option.textContent = subjectTitle(subject);
      option.selected = subject.id === state.subjectId;
      els.subjectSelect.append(option);
    });
  }

  function populateFilters(subject) {
    const existingTopic = subject.topics.some((topic) => topic.id === state.topic);
    const existingSource = subject.sources.some((source) => source.id === state.source);
    if (!existingTopic) state.topic = "all";
    if (!existingSource) state.source = "all";

    els.topicFilter.innerHTML = "";
    els.topicFilter.append(new Option(t("allTopics"), "all", state.topic === "all", state.topic === "all"));
    subject.topics.forEach((topic) => {
      els.topicFilter.append(new Option(topicLabel(subject, topic), topic.id, state.topic === topic.id, state.topic === topic.id));
    });

    els.sourceFilter.innerHTML = "";
    els.sourceFilter.append(new Option(t("allSources"), "all", state.source === "all", state.source === "all"));
    subject.sources.forEach((source) => {
      els.sourceFilter.append(new Option(sourceLabel(subject, source), source.id, state.source === source.id, state.source === source.id));
    });
  }

  function correctAnswers(question) {
    return Array.isArray(question.answer) ? question.answer : [question.answer];
  }

  function selectedAnswers(question) {
    const value = state.answers[question.id];
    if (value === undefined) return [];
    return Array.isArray(value) ? value : [value];
  }

  function answerLabel(question) {
    const content = localizedQuestion(question);
    return correctAnswers(question)
      .map((index) => `${optionLabel(index)}. ${content.choices[index] || ""}`.trim())
      .join("; ");
  }

  function isAnswered(question) {
    const value = state.answers[question.id];
    return Array.isArray(value) ? value.length > 0 : value !== undefined;
  }

  function answerMatches(question) {
    const selected = selectedAnswers(question).slice().sort((a, b) => a - b);
    const correct = correctAnswers(question).slice().sort((a, b) => a - b);
    return selected.length === correct.length && selected.every((value, index) => value === correct[index]);
  }

  function renderTags(subject, question) {
    els.tagRow.innerHTML = "";
    if (!question) return;

    const topic = topicById(subject, question.topic);
    const source = sourceById(subject, question.source);
    const tags = [
      { text: topic ? topicLabel(subject, topic) : question.topic, className: "" },
      { text: difficultyLabel(question.difficulty), className: "" },
      { text: source ? sourceLabel(subject, source) : question.source, className: "source" },
    ];

    if (question.kind === "generated") {
      tags.push({ text: t("generatedTag"), className: "generated" });
    }

    if (Array.isArray(question.answer)) {
      tags.push({ text: t("multipleAnswerTag"), className: "generated" });
    }

    tags.forEach((tag) => {
      const item = document.createElement("span");
      item.className = `tag ${tag.className}`.trim();
      item.textContent = tag.text;
      els.tagRow.append(item);
    });
  }

  function renderChoices(question) {
    els.choiceList.innerHTML = "";
    if (!question) return;

    const revealed = isRevealed(question);
    const selected = selectedAnswers(question);
    const correct = correctAnswers(question);
    const isMultiple = Array.isArray(question.answer);
    const content = localizedQuestion(question);
    content.choices.forEach((choice, index) => {
      const option = document.createElement("label");
      option.className = "choice";
      if (selected.includes(index)) option.classList.add("is-selected");
      if (revealed && correct.includes(index)) option.classList.add("is-correct");
      if (revealed && selected.includes(index) && !correct.includes(index)) option.classList.add("is-wrong");
      if (isLocked(question)) option.classList.add("is-disabled");

      const control = document.createElement("input");
      control.className = "choice-control";
      control.type = isMultiple ? "checkbox" : "radio";
      control.name = `answer-${question.id}`;
      control.checked = selected.includes(index);
      control.disabled = isLocked(question);
      control.setAttribute("aria-label", `${optionLabel(index)}. ${choice}`);

      const letter = document.createElement("span");
      letter.className = "choice-letter";
      letter.textContent = optionLabel(index);

      const text = document.createElement("span");
      text.className = "choice-text";
      text.textContent = choice;

      option.append(control, letter, text);
      option.addEventListener("click", (event) => {
        event.preventDefault();
        if (isLocked(question)) return;
        if (isMultiple) {
          const next = selected.includes(index)
            ? selected.filter((value) => value !== index)
            : [...selected, index].sort((a, b) => a - b);
          if (next.length) state.answers[question.id] = next;
          else delete state.answers[question.id];
        } else {
          state.answers[question.id] = index;
        }
        saveState();
        render();
      });
      els.choiceList.append(option);
    });
  }

  function renderFeedback(question) {
    els.feedbackBox.hidden = true;
    els.feedbackBox.className = "feedback";
    els.feedbackBox.innerHTML = "";

    if (!question || !isRevealed(question)) return;

    const correct = answerMatches(question);
    const content = localizedQuestion(question);
    const title = document.createElement("strong");
    if (correct) {
      title.textContent = t("feedbackCorrect", answerLabel(question));
      els.feedbackBox.classList.add("good");
    } else if (!isAnswered(question)) {
      title.textContent = t("feedbackUnanswered", answerLabel(question));
      els.feedbackBox.classList.add("bad");
    } else {
      title.textContent = t("feedbackWrong", answerLabel(question));
      els.feedbackBox.classList.add("bad");
    }

    const detail = document.createElement("div");
    detail.textContent = content.explanation || "";
    els.feedbackBox.append(title, detail);
    els.feedbackBox.hidden = false;
  }

  function renderStats(questions) {
    let progress = 0;
    let correct = 0;
    let wrong = 0;

    if (state.mode === "exam" && isExamRevealed()) {
      progress = questions.length;
      correct = questions.filter(answerMatches).length;
      wrong = questions.length - correct;
    } else if (state.mode === "exam") {
      progress = questions.filter(isAnswered).length;
    } else if (state.mode === "practice") {
      const checked = questions.filter((question) => state.submitted[question.id]);
      progress = checked.length;
      correct = checked.filter(answerMatches).length;
      wrong = checked.length - correct;
    }

    const totalScored = correct + wrong;
    const accuracy = totalScored ? Math.round((correct / totalScored) * 100) : 0;
    const percent = questions.length ? Math.round((progress / questions.length) * 100) : 0;

    els.progressText.textContent = `${progress}/${questions.length}`;
    els.progressBar.style.width = `${percent}%`;
    els.correctText.textContent = String(correct);
    els.wrongText.textContent = String(wrong);
    els.accuracyText.textContent = `${accuracy}%`;
  }

  function renderMap(questions) {
    els.questionMap.innerHTML = "";
    questions.forEach((question, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "map-btn";
      button.textContent = String(index + 1);
      if (index === state.currentIndex) button.classList.add("is-current");
      if (isAnswered(question)) button.classList.add("is-answered");
      if (state.mode === "exam" && isExamRevealed()) {
        button.classList.toggle("is-correct", answerMatches(question));
        button.classList.toggle("is-wrong", !answerMatches(question));
      }
      if (state.mode === "practice" && state.submitted[question.id]) {
        button.classList.toggle("is-correct", answerMatches(question));
        button.classList.toggle("is-wrong", !answerMatches(question));
      }
      button.addEventListener("click", () => setCurrentById(question.id));
      els.questionMap.append(button);
    });
  }

  function renderControls(question, questions) {
    els.prevBtn.disabled = state.currentIndex <= 0 || questions.length === 0;
    els.nextBtn.disabled = state.currentIndex >= questions.length - 1 || questions.length === 0;

    if (!question) {
      els.submitBtn.disabled = true;
      els.submitBtn.textContent = t("submitCheck");
      return;
    }

    if (state.mode === "exam") {
      els.submitBtn.textContent = isExamRevealed() ? t("submitExamDone") : t("submitExam");
      els.submitBtn.disabled = isExamRevealed();
      return;
    }

    if (state.mode === "review") {
      els.submitBtn.textContent = t("submitAnswer");
      els.submitBtn.disabled = true;
      return;
    }

    els.submitBtn.textContent = state.submitted[question.id] ? t("submitChecked") : t("submitCheck");
    els.submitBtn.disabled = !isAnswered(question) || Boolean(state.submitted[question.id]);
  }

  function render() {
    const subject = currentSubject();
    if (!subject) return;

    applyStaticLanguage();
    populateSubjectSelect();
    populateFilters(subject);

    const questions = filteredQuestions();
    const question = activeQuestion();
    const source = question ? sourceById(subject, question.source) : null;
    const content = question ? localizedQuestion(question) : null;

    els.subjectCode.textContent = "IT1140";
    els.subjectTitle.textContent = "Tin học đại cương";
    els.searchInput.value = state.query;
    els.bookmarkOnly.checked = state.bookmarkOnly;

    els.filteredCount.textContent = String(questions.length);
    els.questionCount.textContent = question ? t("questionCount", state.currentIndex + 1, questions.length) : t("questionCountEmpty");
    els.questionText.textContent = content ? content.prompt : t("noQuestion");
    els.bookmarkBtn.classList.toggle("is-active", Boolean(question && state.bookmarks[question.id]));
    els.bookmarkBtn.textContent = question && state.bookmarks[question.id] ? "★" : "☆";
    els.sourceText.textContent = source ? sourceLabel(subject, source) : "-";

    renderTags(subject, question);
    renderChoices(question);
    renderFeedback(question);
    renderStats(questions);
    renderMap(questions);
    renderControls(question, questions);

    saveState();
  }

  els.subjectSelect.addEventListener("change", (event) => {
    state.subjectId = event.target.value;
    state.currentIndex = 0;
    render();
  });

  els.searchInput.addEventListener("input", (event) => {
    state.query = event.target.value;
    state.currentIndex = 0;
    render();
  });

  els.topicFilter.addEventListener("change", (event) => {
    state.topic = event.target.value;
    state.currentIndex = 0;
    render();
  });

  els.sourceFilter.addEventListener("change", (event) => {
    state.source = event.target.value;
    state.currentIndex = 0;
    render();
  });

  els.bookmarkOnly.addEventListener("change", (event) => {
    state.bookmarkOnly = event.target.checked;
    state.currentIndex = 0;
    render();
  });

  els.modeButtons.forEach((button) => {
    button.addEventListener("click", () => {
      state.mode = button.dataset.mode;
      render();
    });
  });

  els.shuffleBtn.addEventListener("click", () => {
    const subject = currentSubject();
    const questions = filteredQuestions();
    state.orders[subject.id] = shuffle(questions.map((question) => question.id));
    state.currentIndex = 0;
    render();
  });

  els.resetBtn.addEventListener("click", () => {
    const subject = currentSubject();
    subject.questions.forEach((question) => {
      delete state.answers[question.id];
      delete state.submitted[question.id];
    });
    delete state.examRevealed[subject.id];
    state.currentIndex = 0;
    render();
  });

  els.bookmarkBtn.addEventListener("click", () => {
    const question = activeQuestion();
    if (!question) return;
    if (state.bookmarks[question.id]) {
      delete state.bookmarks[question.id];
    } else {
      state.bookmarks[question.id] = true;
    }
    render();
  });

  els.prevBtn.addEventListener("click", () => {
    state.currentIndex = Math.max(0, state.currentIndex - 1);
    render();
  });

  els.nextBtn.addEventListener("click", () => {
    const questions = filteredQuestions();
    state.currentIndex = Math.min(questions.length - 1, state.currentIndex + 1);
    render();
  });

  els.submitBtn.addEventListener("click", () => {
    const question = activeQuestion();
    if (!question) return;

    if (state.mode === "exam") {
      state.examRevealed[state.subjectId] = true;
    } else if (state.mode === "practice" && isAnswered(question)) {
      state.submitted[question.id] = true;
    }
    render();
  });

  render();

  if ("serviceWorker" in navigator && window.location.protocol !== "file:") {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {
        // Trang vẫn hoạt động bình thường nếu trình duyệt không cho phép bộ nhớ đệm ngoại tuyến.
      });
    });
  }
})();
