name: Phát hành website IT1140

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7
      - name: Kiểm tra dữ liệu học tập
        run: |
          node scripts/validate-data.mjs
          node scripts/test-quiz.mjs
      - name: Chuẩn bị Python kiểm chứng đáp án
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Kiểm chứng các câu đọc mã Python và NumPy
        run: |
          python -m pip install numpy==2.2.6
          python scripts/test-python-quiz.py
      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v6
      - name: Chuẩn bị website tĩnh
        run: |
          mkdir _site
          cp index.html sw.js CNAME .nojekyll _site/
          cp -R assets data _site/
      - name: Đóng gói website tĩnh
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Phát hành
        id: deployment
        uses: actions/deploy-pages@v5
