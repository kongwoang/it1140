name: Phát hành website IT1140

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5
      - name: Chuẩn bị website tĩnh
        run: |
          mkdir _site
          cp index.html sw.js CNAME .nojekyll _site/
      - name: Đóng gói website tĩnh
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Phát hành
        id: deployment
        uses: actions/deploy-pages@v4
